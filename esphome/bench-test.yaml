# VINDRIKTNING+ bench test
# Flash this to an ESP32-C3 SuperMini on a breadboard to check parts as they
# arrive, before anything is soldered into a case. See testing.md.
#
# - Plug in only the parts you want to test. Missing sensors just log an
#   error and are skipped; everything else keeps working.
# - Readings show in the logs AND on a web page at http://vplus-bench.local
#   (or the board's IP), so Home Assistant isn't needed.
# - Uses the same pins as the real build (wiring.md), so a passing setup can be
#   soldered as-is.

esphome:
  name: vplus-bench
  friendly_name: VPlus Bench

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Uncomment if a SuperMini keeps dropping off Wi-Fi (common antenna issue).
  # output_power: 8.5dB
  ap:
    password: !secret fallback_ap_password

captive_portal:

web_server:
  port: 80
  version: 3

logger:
  level: DEBUG

# Blinks the on-board LED (GPIO8): proves the board boots and runs firmware.
output:
  - platform: gpio
    pin:
      number: GPIO8
      ignore_strapping_warning: true   # it's the on-board LED, safe to drive
    id: board_led
    inverted: true

interval:
  - interval: 1s
    then:
      - output.turn_on: board_led
      - delay: 100ms
      - output.turn_off: board_led

# PM1006 inside the VINDRIKTNING (REST pad -> GPIO20). Only used in the last test.
uart:
  - id: pm_uart
    rx_pin: GPIO20
    baud_rate: 9600

# The scan result is printed at boot: look for 0x44, 0x59, 0x62, 0x76/0x77.
i2c:
  id: bus_a
  sda: GPIO6
  scl: GPIO7
  scan: true
  frequency: 100kHz

sensor:
  - platform: wifi_signal
    name: Wi-Fi Signal
    update_interval: 10s

  - platform: uptime
    name: Uptime
    update_interval: 10s

  # SHT40 / SHT41 / SHT45
  - platform: sht4x
    address: 0x44
    update_interval: 5s
    temperature:
      name: SHT40 Temperature
      id: sht_temp
    humidity:
      name: SHT40 Humidity
      id: sht_rh

  # SCD40 / SCD41. No offsets or calibration here on purpose: we want to see
  # what the sensor reads out of the box.
  - platform: scd4x
    address: 0x62
    update_interval: 5s
    temperature_offset: 0 °C
    co2:
      name: SCD40 CO2
    temperature:
      name: SCD40 Temperature
    humidity:
      name: SCD40 Humidity

  # SGP41 / SGP40
  - platform: sgp4x
    update_interval: 5s
    compensation:
      temperature_source: sht_temp
      humidity_source: sht_rh
    voc_index:
      name: SGP41 VOC Index
    nox_index:
      name: SGP41 NOx Index

  # BME280 (optional part). A BMP280 sold as a BME280 shows "Wrong chip ID".
  - platform: bme280_i2c
    address: 0x76
    update_interval: 5s
    pressure:
      name: BME280 Pressure
    temperature:
      name: BME280 Temperature
    humidity:
      name: BME280 Humidity

  # DFRobot Fermion MEMS H2S, analog out on GPIO3, powered from 3V3
  - platform: adc
    pin: GPIO3
    name: H2S Voltage
    attenuation: 12db
    update_interval: 2s
    accuracy_decimals: 3

  # VINDRIKTNING PM2.5 (only when wired to a VINDRIKTNING)
  - platform: pm1006
    uart_id: pm_uart
    pm_2_5:
      name: PM2.5
